<!doctype html>
<html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate"><title>픽앤플레이스 한눈에 보기</title>
<style>
  :root { --bg:#f4f5f7; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --card:#ffffff; --accent:#0e7490; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e5e7eb; --muted:#9ca3af; --line:#2a2f38; --card:#161a20; --accent:#22d3ee; } }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); font-family:"Noto Sans CJK KR","Noto Sans KR",system-ui,sans-serif; }

  html, body { height:100%; }
  header { display:flex; align-items:baseline; gap:16px; padding:12px 20px 8px; }
  header h1 { margin:0; font-size:18px; } header a { font-size:13px; color:var(--muted); }
  main { display:grid; grid-template-columns:58fr 42fr; gap:12px; padding:0 12px 12px; height:calc(100vh - 52px); }
  section { display:flex; flex-direction:column; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  section h2 { margin:0; padding:8px 14px; font-size:14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; }
  section h2 a { font-size:12px; font-weight:400; color:var(--muted); text-decoration:none; }
  iframe { flex:1; width:100%; border:0; background:var(--card); }
  @media (max-width:1700px) { main { grid-template-columns:1fr; height:auto; } iframe { height:85vh; } }
</style></head><body>
<header><h1>픽앤플레이스 한눈에 보기</h1><a href="index.html">← 목록으로</a></header>
<main>
  <section><h2>전체 흐름 <a href="pickplace/pickplace.html" target="_blank">새 탭으로 크게 보기 ↗</a></h2><iframe src="pickplace/pickplace.html" title="전체 흐름"></iframe></section>
  <section><h2>집어서 옮기는 10단계 <a href="tensteps/tensteps.html" target="_blank">새 탭으로 크게 보기 ↗</a></h2><iframe src="tensteps/tensteps.html" title="집어서 옮기는 10단계"></iframe></section>
</main></body></html>
